<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NakisPanel · Giriş</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#b5121b,#7a0c12);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1d2733}
.box{background:#fff;border-radius:14px;padding:30px 28px;width:min(360px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.3)}
h1{margin:0 0 4px;font-size:22px;color:#b5121b}p{margin:0 0 18px;color:#6b7785;font-size:13px}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px;color:#4a5568}
input{width:100%;padding:10px 12px;border:1px solid #cfd6de;border-radius:8px;font-size:15px}
input:focus{outline:2px solid #2563eb;border-color:#2563eb}
button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:#c4252d;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.6}.err{color:#c4252d;font-size:13px;min-height:18px;margin-top:10px}
.pw{position:relative}.pw input{padding-right:42px}#eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:4px 8px;background:none;color:inherit;font-size:18px;border:0;cursor:pointer;opacity:.7}#eye:hover{opacity:1}
.lang{text-align:right;font-size:12px}.lang a{color:#2563eb;cursor:pointer;margin-left:8px}
</style></head><body>
<form class="box" id="f">
  <div class="lang"><a data-l="tr">TR</a><a data-l="de">DE</a></div>
  <h1>NakisPanel</h1><p data-t="sub"></p>
  <label data-t="u"></label><input id="u" autocomplete="username" autofocus>
  <label data-t="p"></label><div class="pw"><input id="p" type="password" autocomplete="current-password"><button type="button" id="eye" tabindex="-1" title="Şifreyi göster / gizle">👁</button></div>
  <button id="b" data-t="go"></button><div class="err" id="e"></div>
</form>
<script>
const T={tr:{sub:'Nakis Food yönetim paneli',u:'Kullanıcı adı',p:'Şifre',go:'Giriş',bad:'Kullanıcı adı veya şifre hatalı.',net:'Sunucuya ulaşılamadı.'},
 de:{sub:'Nakis Food Verwaltung',u:'Benutzername',p:'Passwort',go:'Anmelden',bad:'Benutzername oder Passwort falsch.',net:'Server nicht erreichbar.'}};
let L=(localStorage.getItem('nakis_dil_v1')||localStorage.getItem('np_lang')||(navigator.language||'').slice(0,2))==='de'?'de':'tr';
function ap(){document.documentElement.lang=L;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[L][e.dataset.t]);}
document.querySelectorAll('[data-l]').forEach(a=>a.onclick=()=>{L=a.dataset.l;try{localStorage.setItem('np_lang',L);localStorage.setItem('nakis_dil_v1',L)}catch(e){}ap();});ap();
eye.onmousedown=ev=>ev.preventDefault();eye.onclick=()=>{const sh=p.type==='password';p.type=sh?'text':'password';eye.textContent=sh?'🙈':'👁';};
f.onsubmit=async ev=>{ev.preventDefault();b.disabled=true;e.textContent='';
 try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:u.value,p:p.value})});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&j.ok){try{sessionStorage.setItem('nakis_oturum_v1',j.u)}catch(x){}location.href='/';return;}
  e.textContent=T[L].bad;p.value='';p.focus();}
 catch(x){e.textContent=T[L].net;}b.disabled=false;};
</script></body></html>
